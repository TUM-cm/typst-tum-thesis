name: Build thesis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build -L
      - uses: actions/upload-artifact@v7
        with:
          name: thesis
          path: result/thesis.pdf
      # Repositories created from this template inherit this workflow. The
      # repository check keeps unfinished theses from being published there.
      - if: github.event_name == 'push' && github.repository == 'TUM-cm/typst-tum-thesis'
        uses: actions/upload-pages-artifact@v5
        with:
          path: result

  deploy:
    if: github.event_name == 'push' && github.repository == 'TUM-cm/typst-tum-thesis'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}thesis.pdf
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
